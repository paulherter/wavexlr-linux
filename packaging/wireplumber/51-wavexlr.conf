# Wave XLR for Linux: makes the microphone work while playback is active and gives the devices plain names.
# Based on https://github.com/jmansar/wavexlr-on-linux-cfg (MIT). Installed by install.sh.
wireplumber.components = [
  {
    name = wavedevicefix.lua,
    type = script/lua
    provides = custom.wavexlrfix,
    arguments = { device = "wavexlr" }
  }
]

wireplumber.profiles = {
  main = {
    custom.wavexlrfix = required
  }
}

monitor.alsa.rules = [
  {
    # the script creates its own, correctly ordered playback device
    matches = [
      {
        node.name = "~alsa_output.usb-Elgato_Systems_Elgato_Wave_XLR_*"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_input.usb-Elgato_Systems_Elgato_Wave_XLR_*"
      }
    ]
    actions = {
      update-props = {
        node.name = "wavexlr-source"
        node.description = "Wave XLR Microphone"
        node.nick = "Wave XLR Microphone"
        # the default microphone, unless you chose another one yourself
        priority.session = 2000
        priority.driver = 2000
      }
    }
  }
]
