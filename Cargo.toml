[package]
name = "wavexlr"
version = "0.1.2"
edition = "2021"
description = "Tray app that keeps and controls the levels of the Elgato Wave XLR (unofficial)"
license = "MIT"

[dependencies]
alsa = "0.12.1"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11"] }
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2.191"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
